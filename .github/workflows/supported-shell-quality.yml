name: Supported shell quality

"on":
  pull_request:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  supported-shell:
    name: Supported shell scripts
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lightweight validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck tcsh

      - name: Check supported shell scripts
        run: ./tools/ci/check-supported-shell.sh
